# See https://pre-commit.com for usage.
# Git hook: run `python scripts/install_pre_commit_hook.py` so commits use
# scripts/pre_commit_wrapper.py (git stash --keep-index before hooks). That avoids
# "Stashed changes conflicted with hook auto-fixes" when ruff --fix runs with unstaged files.
# 첫 훅 실패 시 나머지 생략 → 로그가 짧아져 원인 파악이 쉬움.
#
# Mypy는 pre-commit에 넣지 않음: 훅이 수십 초 걸리는 동안 IDE 저장 등으로 git diff가
# 바뀌면 "files were modified by this hook" 오탐이 난다. 타입 검사는 CI(.github/workflows/ci.yml)
# 및 로컬 `python -m mypy app`으로 수행한다.
fail_fast: true

default_language_version:
  python: python3.11

repos:
  - repo: local
    hooks:
      - id: check-mixed-stage-python
        name: check mixed stage (app/tests *.py)
        entry: python scripts/pre_commit_check_mixed_stage.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.11
        args: [--line-length=120]
        files: ^(app|tests)/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(app|tests)/
