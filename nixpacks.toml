# nixpacks.toml
# Python 버전: runtime.txt (3.11). 설치: requirements.txt 강제 사용(phases.install).

[phases.install]
cmds = ["pip install --no-cache-dir -r requirements.txt"]

[start]
# Single head: 007_merge_heads. If build has no merge (multiple heads), target v7 head so deploy succeeds.
cmd = "(alembic upgrade head || alembic upgrade 006_schema_contract_fix) && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"