# nixpacks.toml
# Python 버전: runtime.txt (3.11). 설치: requirements.txt 강제 사용(phases.install).

[phases.install]
cmds = ["pip install --no-cache-dir -r requirements.txt"]

[start]
# API process runs uvicorn only. Migrations run in Release Phase (Railway Release Command). See DEPLOYMENT.md.
# Single head required (007_merge_heads). Deploy branch must include alembic/versions/007_merge_heads.py.
# APP_ENTRY=api ensures the API process passes main.py check (avoids RuntimeError when env has APP_ENTRY=celery).
cmd = "APP_ENTRY=api uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"