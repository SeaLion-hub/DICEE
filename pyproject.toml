[project]
name = "dicee"
version = "0.1.0"
description = "DICEE backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: tests that need DATABASE_URL or full stack (see tests/integration/)",
    "slow: opt-in long-running tests; exclude locally with -m \"not slow\"",
]

# yonsei_* crawlers: repetitive per-college templates; aggregate coverage is tracked without them.
[tool.coverage.run]
source = ["app"]
omit = [
    "app/services/crawlers/yonsei_*.py",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["F821", "UP037"]  # SQLAlchemy forward ref, quoted annotations

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

# NOTE:
# Keep `mypy app` baseline green first. Add strictness later with per-module flags
# (e.g. disallow_untyped_defs) instead of `strict = true` in overrides.

# Import Linter: 계층 규칙 단일 소스. CI 및 test_architecture_imports에서 실행.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "API must not import repositories"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.repositories"]
allow_indirect_imports = true  # 기존 AST 검사와 동일: 직접 import만 금지 (api -> deps -> repo 허용)

[[tool.importlinter.contracts]]
name = "Services must not import schemas"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.schemas"]
