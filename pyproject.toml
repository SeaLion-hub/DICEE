[project]
name = "dicee"
version = "0.1.0"
description = "DICEE backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    # pyjwt-key-fetcher / lifespan teardown vs pytest GC 순서로 세션 정리 경고가 남는 경우가 있음 (프로덕션은 lifespan에서 aclose 시도).
    "ignore:Unclosed client session:ResourceWarning",
    "ignore:Unclosed <MemoryObjectReceiveStream:ResourceWarning",
]
markers = [
    "integration: tests that need DATABASE_URL or full stack (see tests/integration/)",
    "slow: opt-in long-running tests; exclude locally with -m \"not slow\"",
]

# yonsei_* crawlers: repetitive per-college templates; aggregate coverage is tracked without them.
[tool.coverage.run]
source = ["app"]
omit = [
    "app/services/crawlers/yonsei_*.py",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "W", "UP"]
ignore = ["F821", "UP037"]  # SQLAlchemy forward ref, quoted annotations

# Migrations: long single-line DDL is normal. Scripts: sys.path/env bootstrap before app imports.
# Tests: pytest.importorskip / optional deps before app imports (same class as scripts).
# B008: FastAPI Depends()/Header() in defaults is intentional DI.
[tool.ruff.lint.per-file-ignores]
"alembic/**/*.py" = ["E501"]
"scripts/**/*.py" = ["E402", "E501"]
"tests/**/*.py" = ["E402"]
"app/api/**/*.py" = ["B008"]
"app/core/deps.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

# Instructor omitted from pre-commit mypy venv (heavy/unstable dep tree for hooks).
[[tool.mypy.overrides]]
module = [
    "instructor",
    "instructor.*",
    "google",
    "google.generativeai",
    "google.generativeai.*",
    "google.api_core",
    "google.api_core.*",
    "google.genai",
    "google.genai.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pgvector", "pgvector.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

# Pilot: full defs in-module; expand with more [[tool.mypy.overrides]] blocks below.
[[tool.mypy.overrides]]
module = "app.core.sentry_config"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["app.repositories.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "app.services.ai_html_cleaning",
    "app.services.ai_pipeline",
    "app.services.auth_service",
    "app.services.crawl_payload",
    "app.services.crawl_policy",
    "app.services.crawl_service",
    "app.services.gemini_text_embedding",
    "app.services.internal_crawl_service",
    "app.services.logging_context",
    "app.services.crawl_stats_service",
    "app.services.notice_preview_service",
    "app.services.notice_public_service",
    "app.services.notice_semantic_search_service",
    "app.services.read_cache",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["app.api.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# NOTE:
# Keep `mypy app` baseline green first. Add strictness later with per-module flags
# (e.g. disallow_untyped_defs) instead of `strict = true` in overrides.
# Celery tasks (`app.services.tasks`): see docs/decisions/celery-mypy-strategy.md — stubs + typed wrappers.

# Import Linter: 계층 규칙 단일 소스. CI 및 test_architecture_imports에서 실행.
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "API must not import repositories"
type = "forbidden"
source_modules = ["app.api"]
forbidden_modules = ["app.repositories"]
allow_indirect_imports = true  # 기존 AST 검사와 동일: 직접 import만 금지 (api -> deps -> repo 허용)

[[tool.importlinter.contracts]]
name = "Services must not import schemas"
type = "forbidden"
source_modules = ["app.services"]
forbidden_modules = ["app.schemas"]
