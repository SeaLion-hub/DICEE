# Local / CI parity. API must not run migrations; use migrate service only.
# See docs/DEPLOYMENT.md.

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dicee
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dicee"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/dicee
      APP_ENTRY: migrate
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENTRY: api
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/dicee
      REDIS_URL: redis://redis:6379/0
      REDIS_CELERY_URL: redis://redis:6379/1
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/ready', timeout=2); sys.exit(0 if r.status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    # API must not run migrations; migrate service only.

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      APP_ENTRY: celery
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/dicee
      REDIS_URL: redis://redis:6379/0
      REDIS_CELERY_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket,sys; from app.core.celery_app import app as c; i=c.control.inspect(destination=[f'celery@{socket.gethostname()}'], timeout=3); r=i.ping() if i else None; sys.exit(0 if r else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
