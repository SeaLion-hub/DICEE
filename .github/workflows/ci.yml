name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      # Use postgres role (matches POSTGRES_USER). Do not use "root" - PostgreSQL has no default root role.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dicee_test
      APP_ENTRY: migrate
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dicee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests

      - name: Maintainability metrics (advisory, non-blocking)
        continue-on-error: true
        run: |
          radon cc app -a -nc --total-average | tail -n 25 || true
          xenon app --max-absolute F --max-modules B || true

      - name: Mypy
        run: mypy app

      - name: Architecture guard
        run: pytest -q tests/test_architecture_imports.py

      - name: Ensure single Alembic head
        env:
          APP_ENTRY: api
        run: |
          HEADS=$(alembic heads 2>&1)
          COUNT=$(echo "$HEADS" | grep -c '(head)' || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Alembic must have exactly one head. Add a merge migration (e.g. 007_merge_heads) or set down_revision to the current head."
            echo "$HEADS"
            exit 1
          fi

      - name: Run migrations
        run: alembic upgrade head

      - name: Alembic check (ORM vs DB)
        run: alembic check

      - name: Pytest
        run: pytest tests -v --cov=app --cov-report=term-missing --cov-fail-under=55

      - name: pip-audit (SCA)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pip install pip-audit
          EXTRA=()
          while IFS= read -r line || [ -n "$line" ]; do
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            EXTRA+=(--ignore-vuln "$line")
          done < .github/pip-audit-allowlist.txt
          pip-audit -r requirements.txt -r requirements-dev.txt --desc off "${EXTRA[@]}"

      - name: Baseline summary (optional)
        run: |
          pytest tests -q --tb=no 2>&1 | tee pytest_baseline.txt || true
          echo "Pytest baseline:" >> $GITHUB_STEP_SUMMARY
          cat pytest_baseline.txt >> $GITHUB_STEP_SUMMARY || true

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Create minimal .env for compose
        run: touch .env

      - name: Docker Compose smoke
        run: |
          docker compose up -d --wait
          docker compose ps
          docker compose down -v
